<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POP Adapter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>POP <small id="version"></small></strong>
        <span id="status">Checking local connection...</span>
      </header>
      <form id="pair-form">
        <label for="pairing-code">Pairing code</label>
        <input id="pairing-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required />
        <button type="submit">Pair</button>
      </form>
      <section id="platform-section" hidden>
        <h1>Allowed sites</h1>
        <div id="platform-list"></div>
      </section>
      <small>POP observes meaningful text events only on sites you enable.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
