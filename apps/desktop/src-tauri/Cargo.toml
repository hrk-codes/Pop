[package]
name = "pop-desktop"
version = "0.1.0"
description = "POP Windows desktop companion"
authors = ["POP contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "pop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
